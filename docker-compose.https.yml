# HTTPS: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
services:
  frontend:
    ports:
      - "${APP_HOST:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/"]
  backend:
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
