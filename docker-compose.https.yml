# HTTPS: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
  backend:
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
