# Непрерывная интеграция: на каждый push и pull request — линтер, тесты, сборка.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — линтер и тесты (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: traker_test
          POSTGRES_USER: traker
          POSTGRES_PASSWORD: traker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traker" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://traker:traker@localhost:5432/traker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Линтер (ruff)
        run: ruff check .
      - name: Модульные и интеграционные тесты + покрытие
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Миграции применяются к чистой PostgreSQL
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: |
            backend/junit.xml
            backend/coverage.xml

  frontend:
    name: Frontend — тесты и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker:
    name: Сборка Docker-образов
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка docker-compose.yml
        run: docker compose config --quiet
      - name: Сборка образов
        run: docker compose build
      - name: Smoke-тест — стек поднимается и отвечает
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fs http://localhost/api/health/ready && break; sleep 2; done
          curl -fs http://localhost/api/health/ready
          curl -fs http://localhost/ | grep -q '<div id="root">'
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
