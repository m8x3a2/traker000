# Непрерывная доставка: после успешного CI в main образы публикуются в GitHub Container Registry,
# а при наличии секретов DEPLOY_* — разворачиваются на сервере по SSH.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Публикация образов в GHCR
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Развёртывание на сервере
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Проверка наличия секретов
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: echo "enabled=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Обновление контейнеров по SSH
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '~/traker000' }}
            git pull --ff-only
            export IMAGE_TAG=${{ needs.publish.outputs.tag }}
            docker compose pull backend frontend
            docker compose up -d --no-build
            docker image prune -f
            curl -fs http://localhost/api/health/ready
      - name: Секреты не заданы — деплой пропущен
        if: steps.check.outputs.enabled != 'true'
        run: echo "Задайте DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY в Settings → Secrets, чтобы включить автодеплой"
