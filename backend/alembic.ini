# Конфигурация Alembic. Строка подключения берётся из DATABASE_URL (database.py), здесь её нет.
#   alembic upgrade head          — применить все миграции
#   alembic downgrade -1          — откатить последнюю
#   alembic revision --autogenerate -m "описание"  — создать миграцию по изменениям models.py
#   alembic history               — список миграций
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
